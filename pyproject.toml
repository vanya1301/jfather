[project]
name = "jfather"
version = "0.1.0"
description = "Desktop viewer/editor for large JSON with collection-query"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "collection-query>=0.2.0",
    "pyside6>=6.6",
    "requests>=2.25",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jfather"]
