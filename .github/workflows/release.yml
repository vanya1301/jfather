name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      shell: bash
    
    - name: Install dependencies
      run: |
        uv sync
    
    - name: Run tests
      run: |
        uv run pytest -v
      env:
        QT_QPA_PLATFORM: offscreen

  build:
    name: Build ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: jfather-macos
            asset_name: jfather-macos
          - os: ubuntu-latest
            artifact_name: jfather-linux
            asset_name: jfather-linux
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      shell: bash
    
    - name: Install dependencies
      run: |
        uv sync
    
    - name: Install PyInstaller
      run: |
        uv pip install pyinstaller

    # macOS signing/notarization/packaging logic lives in scripts/macos/* so it
    # can be tested locally. Steps below are thin wrappers around those scripts.
    - name: Import signing certificate (macOS)
      if: matrix.os == 'macos-latest'
      env:
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
      run: ./scripts/macos/import-cert.sh

    - name: Build executable
      env:
        # PyInstaller signs nested binaries with this identity when present
        PYINSTALLER_CODESIGN_IDENTITY: ${{ matrix.os == 'macos-latest' && secrets.MACOS_SIGN_IDENTITY || '' }}
        PYINSTALLER_ENTITLEMENTS: ${{ matrix.os == 'macos-latest' && format('{0}/packaging/entitlements.plist', github.workspace) || '' }}
      run: |
        uv run pyinstaller jfather.spec

    - name: Sign app bundle (macOS)
      if: matrix.os == 'macos-latest'
      env:
        MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      run: ./scripts/macos/sign-app.sh

    - name: Notarize app (macOS)
      if: matrix.os == 'macos-latest'
      env:
        NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      run: ./scripts/macos/notarize.sh dist/jfather.app

    - name: Package DMG (macOS)
      if: matrix.os == 'macos-latest'
      env:
        MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      run: ./scripts/macos/build-dmg.sh

    - name: Notarize DMG (macOS)
      if: matrix.os == 'macos-latest'
      env:
        NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      run: ./scripts/macos/notarize.sh dist/jfather-macos.dmg

    - name: Clean up keychain (macOS)
      if: ${{ always() && matrix.os == 'macos-latest' }}
      run: ./scripts/macos/cleanup-keychain.sh

    - name: Prepare Linux artifact
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd dist
        mv jfather ${{ matrix.artifact_name }}
        chmod +x ${{ matrix.artifact_name }}

    - name: Upload macOS artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/jfather-macos.dmg

    - name: Upload Linux artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: jfather-macos
        path: dist
    
    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: jfather-linux
        path: dist
    
    - name: Make Linux executable
      run: chmod +x dist/jfather-linux
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/jfather-macos.dmg
          dist/jfather-linux
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
